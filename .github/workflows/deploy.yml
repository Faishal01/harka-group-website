name: Deploy Worker

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      service_to_deploy:
        description: "Service or action to deploy"
        required: true
        type: choice
        default: "all"
        options:
          - "all"
          - "user"
          - "admin"
          - "db"
          - "gas"

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run checks
        run: bun run check

  migrate-db:
    name: Apply D1 Migrations
    needs: [lint]
    if: contains(github.event.head_commit.message, 'migrate_db') || inputs.service_to_deploy == 'db' || inputs.service_to_deploy == 'all'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply Migrations
        uses: cloudflare/wrangler-action@v4
        with:
          workingDirectory: packages/db
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun
          command: d1 migrations apply harka-db --remote

  deploy-user:
    name: Deploy User Worker
    runs-on: ubuntu-latest
    needs: [lint, migrate-db]
    if: |
      always() &&
      needs.lint.result == 'success' &&
      (needs.migrate-db.result == 'success' || needs.migrate-db.result == 'skipped') &&
      (contains(github.event.head_commit.message, 'deploy_user') || inputs.service_to_deploy == 'user' || inputs.service_to_deploy == 'all')
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build User Application
        run: bun --filter=user run build:prod

      - name: Deploy User Worker
        uses: cloudflare/wrangler-action@v4
        with:
          workingDirectory: apps/user
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun
          command: deploy --config dist/server/wrangler.json

  deploy-admin:
    name: Deploy Admin Worker
    runs-on: ubuntu-latest
    needs: [lint, migrate-db]
    if: |
      always() &&
      needs.lint.result == 'success' &&
      (needs.migrate-db.result == 'success' || needs.migrate-db.result == 'skipped') &&
      (contains(github.event.head_commit.message, 'deploy_admin') || inputs.service_to_deploy == 'admin' || inputs.service_to_deploy == 'all')
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Admin Application
        run: bun --filter=admin run build:prod

      - name: Deploy Admin Worker
        uses: cloudflare/wrangler-action@v4
        with:
          workingDirectory: apps/admin
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun
          command: deploy --config dist/server/wrangler.json

  deploy-gas:
    name: Deploy Google Apps Script
    runs-on: ubuntu-latest
    needs: [lint]
    if: |
      always() &&
      needs.lint.result == 'success' &&
      (contains(github.event.head_commit.message, 'deploy_gas') || inputs.service_to_deploy == 'gas' || inputs.service_to_deploy == 'all')
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Authenticate Clasp credentials
        run: |
          echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json

      - name: Configure Clasp Project
        working-directory: apps/gas
        run: |
          echo '${{ secrets.CLASP_JSON }}' > .clasp.json

      - name: Build Google Apps Script
        run: bun --filter=gas run build

      - name: Push Code to Apps Script
        working-directory: apps/gas
        run: bun run clasp push --force

      - name: Deploy Versioned Release
        working-directory: apps/gas
        run: bun run clasp deploy --description "Deployed from commit ${{ github.sha }}"

  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    needs: [lint, migrate-db, deploy-user, deploy-admin, deploy-gas]
    if: |
      always() &&
      github.event_name == 'push' &&
      needs.lint.result == 'success' &&
      (needs.migrate-db.result == 'success' || needs.deploy-user.result == 'success' || needs.deploy-admin.result == 'success' || needs.deploy-gas.result == 'success') &&
      (needs.migrate-db.result != 'failure' && needs.deploy-user.result != 'failure' && needs.deploy-admin.result != 'failure' && needs.deploy-gas.result != 'failure')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run semantic-release
        run: bunx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Notify Discord
    runs-on: ubuntu-latest
    needs: [lint, migrate-db, deploy-user, deploy-admin, deploy-gas, release]
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute deployment status and summary
        id: status
        run: |
          LINT="${{ needs.lint.result }}"
          DB="${{ needs.migrate-db.result }}"
          USER="${{ needs.deploy-user.result }}"
          ADMIN="${{ needs.deploy-admin.result }}"
          GAS="${{ needs.deploy-gas.result }}"
          RELEASE="${{ needs.release.result }}"

          get_icon() {
            case "$1" in
              success) echo "✅ Success" ;;
              failure) echo "❌ Failed" ;;
              cancelled) echo "⏹️ Cancelled" ;;
              skipped) echo "⏭️ Skipped" ;;
              *) echo "$1" ;;
            esac
          }

          if [ "$LINT" = "failure" ] || [ "$DB" = "failure" ] || [ "$USER" = "failure" ] || [ "$ADMIN" = "failure" ] || [ "$GAS" = "failure" ] || [ "$RELEASE" = "failure" ]; then
            OVERALL_STATUS="failure"
          elif [ "$LINT" = "cancelled" ] || [ "$DB" = "cancelled" ] || [ "$USER" = "cancelled" ] || [ "$ADMIN" = "cancelled" ] || [ "$GAS" = "cancelled" ] || [ "$RELEASE" = "cancelled" ]; then
            OVERALL_STATUS="cancelled"
          else
            OVERALL_STATUS="success"
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TRIGGER="Manual dispatch (${{ inputs.service_to_deploy }})"
          else
            TRIGGER="Push to ${{ github.ref_name }}"
          fi

          echo "status=$OVERALL_STATUS" >> "$GITHUB_OUTPUT"

          {
            echo "description<<EOF"
            echo "**Trigger:** $TRIGGER"
            echo ""
            echo "**Lint & Typecheck:** $(get_icon "$LINT")"
            echo "**D1 Migrations:** $(get_icon "$DB")"
            echo "**User Worker:** $(get_icon "$USER")"
            echo "**Admin Worker:** $(get_icon "$ADMIN")"
            echo "**Google Apps Script:** $(get_icon "$GAS")"
            echo "**Semantic Release:** $(get_icon "$RELEASE")"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Send status to Discord Forum Thread
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}?thread_id=${{ secrets.DISCORD_THREAD_ID }}
          status: ${{ steps.status.outputs.status }}
          content: ${{ secrets.DISCORD_ROLE_ID != '' && format('<@&{0}>', secrets.DISCORD_ROLE_ID) || '' }}
          title: "Deployment Summary"
          description: ${{ steps.status.outputs.description }}
          nofail: true
